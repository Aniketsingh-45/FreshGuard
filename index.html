<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshGuard</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1b1f; --card:#f4f5f7; --line:#d9dce1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151a; --fg:#ececf1; --card:#1e2027; --line:#34363f; }
  }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg);
         max-width: 820px; margin: 32px auto; padding: 0 16px; }
  textarea, input[type=text] { width:100%; padding:10px; box-sizing:border-box;
             background:var(--card); color:var(--fg); border:1px solid var(--line);
             border-radius:8px; font-size:15px; }
  textarea { height:140px; }
  button { padding:10px 18px; border:0; border-radius:8px; background:#2563eb;
           color:#fff; font-size:15px; cursor:pointer; margin-top:8px; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--line); border-left-width:6px;
          border-radius:8px; padding:12px 14px; margin-top:12px; }
  .good { border-left-color:#16a34a; } .warn { border-left-color:#d97706; }
  .bad { border-left-color:#dc2626; }
  .score { font-weight:700; float:right; }
  .meta { font-size:13px; opacity:.75; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:8px;
         padding:12px 14px; margin-top:12px; white-space:pre-wrap; }
  .fixed { border-left:6px solid #16a34a; }
  h2 { margin-top:40px; border-top:1px solid var(--line); padding-top:24px; }
  a { color:#2563eb; }
</style>
</head>
<body>
<h1>FreshGuard</h1>
<p>Paste an AI-generated answer. FreshGuard finds time-sensitive claims and re-checks them against live web sources.</p>
<textarea id="text">The CEO of Twitter is Parag Agrawal. Python 3.8 is the latest Python release.</textarea>
<br><button id="go">Check freshness</button>
<div id="out"></div>

<h2>Ask an AI, then fix it</h2>
<p>A fast AI model answers your question. FreshGuard checks that answer against the live web and rewrites it if facts are stale.</p>
<input type="text" id="q" value="What is the latest stable version of Python, and what is its main new feature?">
<button id="ask">Ask and verify</button>
<div id="askout"></div>

<script>
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function host(u){ try { return new URL(u).hostname; } catch (e) { return String(u); } }

function renderClaims(data) {
  if (data.error) return "<p>Error: " + esc(data.error) + "</p>";
  if (!data.claims || !data.claims.length) return "<p>No time-sensitive claims found.</p>";
  return "<p class='meta'>Checked on " + esc(data.checked_on) + "</p>" + data.claims.map(c => {
    const cls = c.score >= 70 ? "good" : c.score >= 35 ? "warn" : "bad";
    const src = (c.sources || []).slice(0,3).map(u => "<a href='" + esc(u) + "' target='_blank' rel='noopener'>" + esc(host(u)) + "</a>").join(" &middot; ");
    return "<div class='card " + cls + "'><span class='score'>" + esc(c.score) + "/100</span>" +
      "<b>" + esc(c.claim) + "</b>" +
      "<div class='meta'>" + esc(c.type) + " &middot; " + esc(c.verdict) + " &middot; confidence " + esc(c.confidence) + "</div>" +
      (c.corrected_fact ? "<p><b>Current fact:</b> " + esc(c.corrected_fact) + "</p>" : "") +
      "<p class='meta'>" + esc(c.reason) + "</p><div class='meta'>Sources: " + (src || "none") + "</div></div>";
  }).join("");
}

async function post(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  return r.json();
}

document.getElementById("go").onclick = async () => {
  const btn = document.getElementById("go"), out = document.getElementById("out");
  btn.disabled = true; out.innerHTML = "<p>Checking, this can take 20-60 seconds...</p>";
  try { out.innerHTML = renderClaims(await post("/check", {text: document.getElementById("text").value})); }
  catch (e) { out.innerHTML = "<p>Error: " + esc(e.message) + "</p>"; }
  finally { btn.disabled = false; }
};

document.getElementById("ask").onclick = async () => {
  const btn = document.getElementById("ask"), out = document.getElementById("askout");
  btn.disabled = true; out.innerHTML = "<p>Asking the AI, then verifying. This can take up to a minute...</p>";
  try {
    const d = await post("/ask", {question: document.getElementById("q").value});
    if (d.error) { out.innerHTML = "<p>Error: " + esc(d.error) + "</p>"; return; }
    let h = "<h3>1. The AI's answer</h3><div class='box'>" + esc(d.answer) + "</div>";
    h += "<h3>2. FreshGuard's check</h3>" + renderClaims(d.check);
    h += "<h3>3. Corrected answer</h3>";
    if (d.corrected_answer && d.changed) h += "<div class='box fixed'>" + esc(d.corrected_answer) + "</div>";
    else if (d.corrected_answer) h += "<p>No stale facts were found, so the answer is unchanged.</p>";
    else h += "<p>Could not produce a corrected answer.</p>";
    out.innerHTML = h;
  } catch (e) { out.innerHTML = "<p>Error: " + esc(e.message) + "</p>"; }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
